services:
  bot-15m:
    build: .
    container_name: polymarket-bot-15m
    restart: unless-stopped
    tty: true
    stdin_open: true
    env_file:
      - path: .env
        required: false
    environment:
      BOT_MODE: 15m
    mem_limit: 512m
    volumes:
      - polymarket_logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot-5m:
    build: .
    container_name: polymarket-bot-5m
    restart: unless-stopped
    tty: true
    stdin_open: true
    env_file:
      - path: .env
        required: false
    environment:
      BOT_MODE: 5m
    mem_limit: 512m
    volumes:
      - polymarket_logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: polymarket-dashboard
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SQLITE_PATH: ${SQLITE_PATH:-/app/logs/auth.db}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3456}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://localhost:3456,http://localhost:5173}
      DASHBOARD_ADMIN_EMAIL: ${DASHBOARD_ADMIN_EMAIL}
      DASHBOARD_ADMIN_PASSWORD: ${DASHBOARD_ADMIN_PASSWORD}
      DASHBOARD_ADMIN_NAME: ${DASHBOARD_ADMIN_NAME:-Admin}
      DASHBOARD_ADMIN_RESET_PASSWORD: ${DASHBOARD_ADMIN_RESET_PASSWORD:-false}
    ports:
      - "3456:3456"
    volumes:
      - polymarket_logs:/app/logs
    mem_limit: 256m
    depends_on:
      bot-15m:
        condition: service_started
      bot-5m:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  polymarket_logs:
